<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espelho</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='mirror.css') }}">
</head>
<body>
  <!-- Black = transparent behind two-way glass. Only bright text shows through. -->
  <header>
    <div>
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div id="weather" class="weather"></div>
  </header>

  <main id="result" class="result hidden" aria-live="polite"></main>

  <footer>
    <div id="hint">Pressione o botão ou toque abaixo</div>
    <div class="buttons">
      <button id="btn-check">Avaliar meu look</button>
      <button id="btn-suggest">Sugerir um look</button>
    </div>
    <div class="occasion">
      <label for="occasion">Ocasião:</label>
      <select id="occasion">
        <option value="">Dia normal</option>
        <option value="trabalho no escritório">Trabalho</option>
        <option value="reunião formal">Reunião formal</option>
        <option value="encontro / jantar">Encontro / jantar</option>
        <option value="academia">Academia</option>
        <option value="festa">Festa</option>
      </select>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='mirror.js') }}"></script>
</body>
</html>
